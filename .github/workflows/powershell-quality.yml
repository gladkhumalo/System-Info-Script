name: PowerShell quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze PowerShell
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path . -Recurse -File |
            Where-Object Extension -in '.ps1', '.psm1', '.psd1'
          $results = $scripts |
            Invoke-ScriptAnalyzer -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize

          if ($results) {
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

  test-pwsh:
    name: Test PowerShell 7
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Run tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI -Output Detailed

  test-windows-powershell:
    name: Test Windows PowerShell 5.1
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: powershell
        run: Invoke-Pester -Path ./tests -CI -Output Detailed
